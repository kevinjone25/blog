name: Deploy Cloudflare

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      target:
        description: 'Preview first; production also binds blog.zzy.tw.'
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

# Serialize complete deployments, keeping production separate from preview.
concurrency:
  group: cloudflare-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.target == 'production' && 'production' || 'preview' }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'production' && 'cloudflare-production' || 'cloudflare-preview' }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      # prebuild cleans generated content state; build runs astro check, astro build and verify-static.
      - name: Build static site
        run: npm run build

      - name: Check Cloudflare credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub Actions secrets."
            exit 1
          fi

      - name: Deploy static site
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.151.3'
          packageManager: npm
          # `--env=` selects the top-level (production) config as a single token;
          # a quoted empty argument (`--env ""`) is dropped by wrangler-action.
          command: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'production' && 'deploy --env=' || 'deploy --env preview' }}
